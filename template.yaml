AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  s3-blob-store: one private S3 bucket holding ciphertext blobs,
  fronted by a Lambda Function URL that checks a bearer token.
  The Lambda never decrypts; it stores and returns opaque text
  by label. CloudFormation holds its own state, so there is no
  bootstrap stack and no backend file. This template is GENERATED
  from template.skeleton.yaml + lambda/index.py by
  tools/build_template.py — edit those, not template.yaml.

Parameters:
  BearerTokenSha256:
    Type: String
    NoEcho: true
    AllowedPattern: "^[0-9a-f]{64}$"
    ConstraintDescription: Must be a lowercase SHA-256 hex digest (64 characters).
    Description: >-
      SHA-256 hex digest of the bearer token that will guard the
      Function URL. Only the digest enters the stack: the Lambda
      hashes each presented token and compares digests, so the
      digest cannot be replayed as a credential. Generate the token
      and this digest with the one-liner in the README (CloudShell),
      and keep the plaintext token in a password manager. Note:
      CloudFormation ignores NoEcho parameters in quick-create
      URLs, so you paste this value into the form — it is never
      carried in the Launch Stack link itself.

  NameSuffix:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[a-z0-9][a-z0-9-]{0,19}[a-z0-9]$|^[a-z0-9]$"
    ConstraintDescription: >-
      Must be empty, or 1-21 lowercase letters, digits and dashes,
      starting and ending with a letter or digit.
    Description: >-
      OPTIONAL suffix appended to the derived blob bucket name,
      for a second instance of the store in the same account and
      region. Leave empty normally. At most 21 characters, so
      handoff-blobs-<account>-<region>-<suffix> stays within S3's
      63-character limit in the longest commercial region names
      (14 characters).

# The blob prefix, defined once: the role's grant and the handler's
# BLOB_PREFIX both read it, so they can't drift apart.
Mappings:
  Store:
    Blobs:
      Prefix: blobs/

Conditions:
  HasNameSuffix: !Not
    - !Equals
      - !Ref NameSuffix
      - ""

Resources:
  # ----------------------------------------------------------------
  # Blob bucket. Versioning is OFF (the S3 default for a new bucket;
  # there is deliberately no VersioningConfiguration here): a
  # replaced or deleted blob must actually be gone through the API,
  # or the STORE-TEST history check fails.
  # Three of the bucket sub-resources Terraform needs (public
  # access block, encryption, ownership controls) are properties
  # here; the fourth, the bucket policy, is BlobBucketPolicy below.
  # ----------------------------------------------------------------
  BlobBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !If
        - HasNameSuffix
        - !Sub "handoff-blobs-${AWS::AccountId}-${AWS::Region}-${NameSuffix}"
        - !Sub "handoff-blobs-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      Tags:
        - Key: Purpose
          Value: blob-store
        - Key: Project
          Value: s3-blob-store

  # TLS only, same posture as the Terraform version's bucket policy.
  BlobBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BlobBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt BlobBucket.Arn
              - !Sub "${BlobBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # ----------------------------------------------------------------
  # Lambda execution role: the only identity that touches the
  # bucket. Object actions only, on this bucket's blob prefix only.
  # No RoleName on purpose: CloudFormation generates the physical
  # name, so the stack needs only CAPABILITY_IAM (not
  # CAPABILITY_NAMED_IAM) and a second stack in the same account
  # cannot collide with this one.
  # ----------------------------------------------------------------
  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: blob-object-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub
                  - "${BlobBucket.Arn}/${Prefix}*"
                  - Prefix: !FindInMap [Store, Blobs, Prefix]

  # ----------------------------------------------------------------
  # The Lambda and its public Function URL. AuthType NONE because
  # the bearer-token check happens in the handler; a request
  # without the token gets a 401 from the code and never touches S3.
  # No FunctionName, for the same generated-name reason as the role.
  # The handler code is inline (ZipFile). lambda/index.py is the
  # canonical source, and the build script keeps it within a
  # 4,096-character budget: the limit CloudFormation long documented
  # for inline code (its current reference gives only a 4 MB zip
  # limit), kept until a larger inline handler is tested live.
  # ----------------------------------------------------------------
  BlobFunction:
    Type: AWS::Lambda::Function
    Properties:
      Handler: index.handler
      Runtime: python3.13
      Timeout: 10
      MemorySize: 128
      Role: !GetAtt LambdaRole.Arn
      Environment:
        Variables:
          BLOB_BUCKET: !Ref BlobBucket
          BLOB_PREFIX: !FindInMap [Store, Blobs, Prefix]
          BEARER_TOKEN_SHA256: !Ref BearerTokenSha256
      Code:
        ZipFile: |
          """Front door for the S3 handoff blob store (test).

          Stores and returns ciphertext blobs by label. This function never
          decrypts anything: it moves opaque text between the caller and one
          S3 bucket, behind a bearer-token check.

          Routes (all require "Authorization: Bearer <token>"):
            GET    /blobs/<label>  -> 200 blob text, or 404
            PUT    /blobs/<label>  -> store/replace blob from request body
            DELETE /blobs/<label>  -> delete blob (200 even if already gone)

          Only the SHA-256 digest of the token is configured here; each
          presented token is hashed and compared in constant time.
          """

          import base64
          import hashlib
          import hmac
          import os
          import re

          import boto3
          from botocore.exceptions import ClientError

          s3 = boto3.client("s3")

          BUCKET = os.environ["BLOB_BUCKET"]
          PREFIX = os.environ.get("BLOB_PREFIX", "blobs/")
          TOKEN_SHA256 = os.environ["BEARER_TOKEN_SHA256"]

          LABEL_RE = re.compile(r"^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$")
          ROUTE_RE = re.compile(r"^/blobs/([^/]+)$")


          def _authorized(event):
              headers = {k.lower(): v for k, v in (event.get("headers") or {}).items()}
              # The auth scheme is case-insensitive (RFC 7235): "bearer" works.
              auth = headers.get("authorization", "")
              if not isinstance(auth, str):
                  return False
              scheme, _, token = auth.partition(" ")
              if scheme.lower() != "bearer" or not token:
                  return False
              digest = hashlib.sha256(token.encode("utf-8", "surrogatepass")).hexdigest()
              return hmac.compare_digest(digest, TOKEN_SHA256)


          def _reply(status, body):
              return {"statusCode": status, "headers": {"Content-Type": "text/plain"}, "body": body}


          def handler(event, _context):
              if not _authorized(event):
                  return _reply(401, "unauthorized")

              http = event.get("requestContext", {}).get("http", {})
              method = http.get("method", "")

              # Health route: connection checkers and operators probe the
              # root. Authorized callers get a plain 200; the blob routes
              # below remain the only way to reach S3.
              if method == "GET" and http.get("path", "") in ("/", ""):
                  return _reply(200, "ok")

              route = ROUTE_RE.match(http.get("path", ""))
              if not route:
                  return _reply(404, "not found")

              label = route.group(1)
              if not LABEL_RE.match(label):
                  return _reply(400, "invalid label")
              key = PREFIX + label

              if method == "GET":
                  try:
                      obj = s3.get_object(Bucket=BUCKET, Key=key)
                  except ClientError as err:
                      # A missing key surfaces as NoSuchKey only for callers
                      # with s3:ListBucket; this role deliberately has none
                      # (listing is not part of the store's contract), so S3
                      # answers AccessDenied instead — it does not confirm or
                      # deny existence to a caller that may not list. Both mean
                      # the same thing to the caller here: no such blob.
                      if err.response["Error"]["Code"] in ("NoSuchKey", "404", "AccessDenied", "403"):
                          return _reply(404, "not found")
                      raise
                  return _reply(200, obj["Body"].read().decode("utf-8"))

              if method == "PUT":
                  body = event.get("body") or ""
                  if event.get("isBase64Encoded"):
                      try:
                          body = base64.b64decode(body, validate=True).decode("utf-8")
                      except ValueError:  # bad base64 or non-UTF-8 bytes
                          return _reply(400, "body must be UTF-8 text")
                  s3.put_object(
                      Bucket=BUCKET,
                      Key=key,
                      Body=body.encode("utf-8"),
                      ContentType="text/plain",
                  )
                  return _reply(200, "stored")

              if method == "DELETE":
                  s3.delete_object(Bucket=BUCKET, Key=key)
                  return _reply(200, "deleted")

              return _reply(405, "method not allowed")
  BlobFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      AuthType: NONE
      TargetFunctionArn: !GetAtt BlobFunction.Arn

  FunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Ref BlobFunction
      Principal: "*"
      FunctionUrlAuthType: NONE

  # AWS also requires a separate lambda:InvokeFunction permission
  # before a NONE-auth Function URL will serve requests at all
  # (observed live 2026-11-20: with only the permission above,
  # every request gets a 403 from AWS before the handler runs).
  # InvokedViaFunctionUrl limits this grant to calls that come
  # through the Function URL, so it doesn't also let any AWS
  # principal invoke the function directly with an event it writes.
  # The handler's bearer-token check stays the gate for every
  # request either way: the function holds nothing but ciphertext
  # access and returns 401 before touching S3.
  FunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref BlobFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

Outputs:
  BlobBucketName:
    Description: Name of the blob bucket (versioning off).
    Value: !Ref BlobBucket
  FunctionUrl:
    Description: Base URL of the blob front door. Blobs live at <url>blobs/<label>.
    Value: !GetAtt BlobFunctionUrl.FunctionUrl
  LambdaRoleArn:
    Description: ARN of the Lambda execution role (the only identity with blob access).
    Value: !GetAtt LambdaRole.Arn
  Region:
    Description: Region this stack was created in.
    Value: !Ref AWS::Region
