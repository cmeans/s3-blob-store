AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  A shared Terraform state bucket for this account and region.
  Creates ONLY the S3 bucket that holds Terraform state, for any
  number of Terraform projects, each under its own state key.
  Deploy it once per account and region; skip it if you already
  have a state bucket. It creates none of a project's resources.
  The state bucket is retained if this stack is deleted.

Parameters:
  StateBucketName:
    Type: String
    Default: ""
    Description: >-
      OPTIONAL override. Leave empty (the default) and the bucket is
      named tfstate-<your AWS account id>-<region>: S3 bucket names
      are global across all of AWS, and an account id suffix makes a
      collision with another account's bucket effectively impossible.
      Set this only if your own naming rules require a different name.
    AllowedPattern: "^$|^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
    ConstraintDescription: Must be empty, or a valid S3 bucket name.

Conditions:
  UseDefaultBucketName: !Equals
    - !Ref StateBucketName
    - ""

Resources:
  TerraformStateBucket:
    Type: AWS::S3::Bucket
    # Retain on purpose: deleting the bootstrap stack must not
    # delete the state that describes everything Terraform manages.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !If
        - UseDefaultBucketName
        - !Sub "tfstate-${AWS::AccountId}-${AWS::Region}"
        - !Ref StateBucketName
      # ON for state (the opposite of the blob bucket):
      # old state versions are your recovery path.
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      Tags:
        - Key: Purpose
          Value: terraform-state

  TerraformStateBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TerraformStateBucket
      PolicyDocument:
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt TerraformStateBucket.Arn
              - !Sub "${TerraformStateBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

Outputs:
  StateBucketName:
    Description: Pass to terraform init as -backend-config="bucket=<this value>".
    Value: !Ref TerraformStateBucket
  StateBucketArn:
    Description: ARN of the Terraform state bucket.
    Value: !GetAtt TerraformStateBucket.Arn
  Region:
    Description: Pass to terraform init as -backend-config="region=<this value>".
    Value: !Ref AWS::Region
