name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only token for every job: nothing here writes to the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # NOTE: pr-labels.yml and pr-labels-ci.yml find this workflow by its name
  # ("CI") and file (ci.yml). If either is renamed, update them too.
  # main's ruleset is meant to require "ci-ok" (below), not this job: if
  # ci-ok is renamed, update the ruleset, or every PR waits on a check that
  # never comes.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false
      - name: Tool versions
        run: |
          python3 --version
          terraform version
      - name: ruff
        run: |
          set -o pipefail
          git ls-files -z -- '*.py' | xargs -0 --no-run-if-empty pipx run ruff==0.15.7 check
      - name: template.yaml is current and within both size limits
        # Fails if template.yaml is stale or hand-edited, if the handler
        # passes the 4,096-character ZipFile limit, or if the template passes
        # the 51,200-byte TemplateBody limit.
        run: python3 tools/build_template.py --check
      - name: build tool tests
        run: python3 -m unittest discover -s tests -v
      - name: cfn-lint
        run: pipx run cfn-lint==1.59.0 template.yaml
      - name: one handler for both deploy paths
        # Until the Terraform route moves under alternates/ and reads
        # lambda/index.py directly (#6), its copy must stay identical.
        run: cmp lambda/index.py terraform/lambda/index.py
      - name: terraform fmt
        run: terraform fmt -check -recursive -diff
      - name: terraform validate
        # -backend=false: CI has no AWS credentials and needs none; validate
        # checks the configuration, not any deployed state.
        # NUL-separated end to end, so a directory name with a space, a quote
        # or a non-ASCII character reaches terraform intact.
        run: |
          set -euo pipefail
          while IFS= read -r -d '' dir; do
            echo "::group::validate $dir"
            terraform -chdir="$dir" init -backend=false -input=false -no-color
            terraform -chdir="$dir" validate -no-color
            echo "::endgroup::"
          done < <(git ls-files -z -- '*.tf' | xargs -0 --no-run-if-empty dirname -z | sort -zu)

  # The one check main's ruleset should require. A required job that is
  # skipped counts as passing, so every job above is gathered here, and this
  # one runs always and fails unless each of them succeeded. A new job must be
  # added to `needs`, or it gates nothing.
  ci-ok:
    if: always()
    needs: [checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every CI job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'length > 0 and all(.[]; .result == "success")' > /dev/null
